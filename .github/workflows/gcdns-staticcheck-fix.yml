name: GoreeCloud DNS staticcheck cleanup

on:
  push:
    branches:
      - agent/beacon-resolver-foundation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/beacon-resolver-foundation
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum
      - name: Fix native DNS staticcheck findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cache = Path('internal/gcdns/cache.go')
          text = cache.read_text()
          old = 'var oldestSeq uint64 = ^uint64(0)'
          new = 'oldestSeq := ^uint64(0)'
          if old not in text:
              raise SystemExit('expected cache staticcheck snippet not found')
          cache.write_text(text.replace(old, new, 1))

          routing = Path('internal/gcdns/routing.go')
          text = routing.read_text()
          old = '\t"sort"\n'
          if old not in text:
              raise SystemExit('expected routing sort import not found')
          text = text.replace(old, '', 1)
          old = '''func sortedRouteNames(routes []ResolverRoute) []string {
\tnames := make([]string, 0, len(routes))
\tfor _, route := range routes {
\t\tnames = append(names, route.Name)
\t}
\tsort.Strings(names)
\treturn names
}

'''
          if old not in text:
              raise SystemExit('expected unused routing helper not found')
          routing.write_text(text.replace(old, '', 1))
          PY
          go tool gofumpt --extra -w internal/gcdns/cache.go internal/gcdns/routing.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/gcdns/cache.go internal/gcdns/routing.go
          git commit -m 'Fix native DNS staticcheck findings'
          git push origin HEAD:agent/beacon-resolver-foundation
