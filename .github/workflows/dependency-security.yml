name: dependency-security

permissions: {}

env:
  NODE_VERSION: '20'

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dependency-security

jobs:
  runtime-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        working-directory: client
        run: npm ci --ignore-scripts
      - name: Report runtime dependency findings
        working-directory: client
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      - name: Enforce runtime high and critical threshold
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

  full-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        working-directory: client
        run: npm ci --ignore-scripts
      - name: Report full dependency findings
        working-directory: client
        shell: bash
        run: |
          set +e
          npm audit --json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      - name: Enforce full high and critical threshold
        working-directory: client
        run: npm audit --audit-level=high
