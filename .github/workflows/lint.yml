# GoreeCloud DNS lint, product identity, design-system, resolver, and frontend validation.
name: lint

permissions: {}

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '20'

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glaze-ui-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Glaze UI contract
        run: python3 scripts/validate_glaze_ui.py

  product-identity-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate GoreeCloud DNS product identity contract
        run: python3 scripts/validate_product_identity.py

  resolver-backend-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Unbound validation tools
        run: sudo apt-get update && sudo apt-get install --yes unbound

      - name: Validate resolver source contract
        run: python3 scripts/validate_resolver_backend.py

      - name: Validate Unbound configuration syntax
        run: |
          sudo mkdir -p /etc/unbound/goreecloud /var/lib/unbound
          sudo cp resolver/unbound/local-zones.conf /etc/unbound/goreecloud/local-zones.conf
          sudo cp resolver/unbound/rpz.conf /etc/unbound/goreecloud/rpz.conf
          sudo touch /var/lib/unbound/root.key
          sudo unbound-control-setup >/dev/null 2>&1
          sudo unbound-checkconf resolver/unbound/unbound.conf

  go-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go lint
        run: make go-deps go-lint

  frontend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install modules
        run: npm --prefix="./client" ci

      - name: Run ESLint
        run: npm --prefix="./client" run lint

      - name: Run TypeScript typecheck
        run: npm --prefix="./client" run typecheck

      - name: Run frontend tests
        run: npm --prefix="./client" run test

      - name: Build production frontend
        run: npm --prefix="./client" run build-prod
