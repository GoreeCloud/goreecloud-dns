# GoreeCloud DNS lint, product identity, and design-system validation.
name: lint

permissions: {}

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '20'

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glaze-ui-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Glaze UI contract
        run: python3 scripts/validate_glaze_ui.py

  product-identity-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate GoreeCloud DNS product identity contract
        run: python3 scripts/validate_product_identity.py

  go-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go lint
        run: make go-deps go-lint

  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install modules
        run: npm --prefix="./client" ci

      - name: Run ESLint
        run: npm --prefix="./client" run lint
