'name': 'lint'
# Permissions are disabled for all the jobs by default, and then overridden for
# specific jobs if needed.  This is a recommended practice for security reasons,
# and also allows to avoid mistakes with permissions when creating new jobs.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions.
'permissions': {}
'env':
  'GO_VERSION': '1.26.6'
'on':
  'workflow_dispatch':
  'push':
    'tags':
      - 'v*'
    'branches':
      - '*'
  'pull_request':
'jobs':
  'beacon-native-core':
    'runs-on': 'ubuntu-latest'
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          'persist-credentials': false
      - 'name': 'Set up Go'
        'uses': 'actions/setup-go@v7'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
          'cache': true
          'cache-dependency-path': 'go.sum'
      - 'name': 'Validate Beacon source contract'
        'run': 'python3 scripts/validate_beacon_foundation.py'
      - 'name': 'Validate Beacon DNSSEC wildcard contract'
        'run': 'python3 scripts/validate_dnssec_wildcard.py'
      - 'name': 'Validate Beacon NSEC3 Opt-Out contract'
        'run': 'python3 scripts/validate_dnssec_optout.py'
      - 'name': 'Validate Beacon RFC 9824 compact denial contract'
        'run': 'python3 scripts/validate_dnssec_compact_denial.py'
      - 'name': 'Validate Beacon DNSSEC alias-chain contract'
        'run': 'python3 scripts/validate_dnssec_alias.py'
      - 'name': 'Validate Beacon referral discovery contract'
        'run': 'python3 scripts/validate_referral_discovery.py'
      - 'name': 'Validate Beacon QNAME minimisation contract'
        'run': 'python3 scripts/validate_qname_minimisation.py'
      - 'name': 'Validate Beacon resolver-routing contract'
        'run': 'python3 scripts/validate_resolver_routing.py'
      - 'name': 'Validate Beacon routed DNSSEC policy contract'
        'run': 'python3 scripts/validate_routed_dnssec_policy.py'
      - 'name': 'Validate Beacon private stub DNSSEC trust-carry contract'
        'run': 'python3 scripts/validate_private_stub_dnssec.py'
      - 'name': 'Validate Beacon DNSSEC algorithm, digest, and key-strength policy'
        'run': 'python3 scripts/validate_dnssec_algorithm_policy.py'
      - 'name': 'Validate Beacon persistent trust-anchor lifecycle'
        'run': 'python3 scripts/validate_trust_anchor_lifecycle.py'
      - 'name': 'Validate Beacon policy profiles'
        'run': 'python3 scripts/validate_policy_profiles.py'
      - 'name': 'Validate Beacon signed filter-list metadata'
        'run': 'python3 scripts/validate_filterlist_signature.py'
      - 'name': 'Test native GoreeCloud DNS core'
        'run': 'go test ./internal/gcdns'

  'go-lint':
    'runs-on': 'ubuntu-latest'
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@v2'
        'with':
          # Set to false to avoid  GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Set up Go'
        'uses': 'actions/setup-go@v3'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
      - 'name': 'run-lint'
        'run': >
          make go-deps go-lint

  'eslint':
    'runs-on': 'ubuntu-latest'
    'permissions':
      'contents': 'read'
    'steps':
      - 'uses': 'actions/checkout@v2'
        'with':
          # Set to false to avoid  GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Install modules'
        'run': 'npm --prefix="./client" ci'
      - 'name': 'Run ESLint'
        'run': 'npm --prefix="./client" run lint'
  'notify':
    'needs':
      - 'beacon-native-core'
      - 'go-lint'
      - 'eslint'
    # Secrets are not passed to workflows that are triggered by a pull request
    # from a fork.
    #
    # Use always() to ensure this job runs even if a dependency fails.
    'if': |
      ${{
        always() &&
        github.repository_owner == 'AdguardTeam' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    'runs-on': 'ubuntu-latest'
    'permissions':
      'actions': 'read'
      'contents': 'read'
    'steps':
      - 'name': 'Conclusion'
        'uses': 'technote-space/workflow-conclusion-action@v1'
      - 'name': 'Send Slack notif'
        'uses': '8398a7/action-slack@v3'
        'with':
          'status': '${{ env.WORKFLOW_CONCLUSION }}'
          'fields': 'repo, message, commit, author, workflow'
        'env':
          'GITHUB_TOKEN': '${{ secrets.GITHUB_TOKEN }}'
          'SLACK_WEBHOOK_URL': '${{ secrets.SLACK_WEBHOOK_URL }}'