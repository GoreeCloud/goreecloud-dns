# GoreeCloud DNS build and test validation.
name: build

permissions: {}

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '20'

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      GO111MODULE: 'on'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Run tests
        shell: bash
        run: make CLIENT_DIR=client VERBOSE=1 deps test go-bench go-fuzz

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    env:
      GO111MODULE: 'on'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build local frontend and DNS server
        run: make CLIENT_DIR=client VERBOSE=1 deps quick-build

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: make CLIENT_DIR=client VERBOSE=1 js-test-e2e

  build-release:
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend-e2e
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Run snapshot build
        run: make SIGN=0 VERBOSE=1 VERSION="v0.0.0-goreecloud" build-release build-docker
