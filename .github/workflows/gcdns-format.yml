name: GoreeCloud DNS format

on:
  push:
    branches:
      - agent/beacon-resolver-foundation

permissions:
  contents: write

jobs:
  format-gcdns:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/beacon-resolver-foundation
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum
      - name: Format native GoreeCloud DNS core
        shell: bash
        run: |
          set -euo pipefail
          go tool gofumpt --extra -w internal/gcdns
          if git diff --quiet -- internal/gcdns; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/gcdns
          git commit -m 'Format native GoreeCloud DNS core'
          git push origin HEAD:agent/beacon-resolver-foundation
