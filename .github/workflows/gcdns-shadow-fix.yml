name: GoreeCloud DNS shadow cleanup

on:
  push:
    branches:
      - agent/beacon-resolver-foundation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/beacon-resolver-foundation
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: go.sum
      - name: Fix native DNS variable shadowing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'internal/gcdns/iterative_dnssec.go': [
                  (
                      '\t\t\tmerged, err := mergeAliasResult(original, priorAnswers, priorTTL, res)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, err\n\t\t\t}\n',
                      '\t\t\tmerged, mergeErr := mergeAliasResult(original, priorAnswers, priorTTL, res)\n\t\t\tif mergeErr != nil {\n\t\t\t\treturn nil, mergeErr\n\t\t\t}\n',
                  ),
                  (
                      '\t\t\tstatus, err := r.terminal.AuthenticateTerminalAnswer(res.Message, parentKeys)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, fmt.Errorf("goreecloud dns: terminal DNSSEC authentication failed: %w", err)\n\t\t\t}\n\t\t\tres.DNSSECStatus = status\n\t\t\tif status == DNSSECSecure {\n',
                      '\t\t\tterminalStatus, terminalErr := r.terminal.AuthenticateTerminalAnswer(res.Message, parentKeys)\n\t\t\tif terminalErr != nil {\n\t\t\t\treturn nil, fmt.Errorf("goreecloud dns: terminal DNSSEC authentication failed: %w", terminalErr)\n\t\t\t}\n\t\t\tres.DNSSECStatus = terminalStatus\n\t\t\tif terminalStatus == DNSSECSecure {\n',
                  ),
                  (
                      '\t\t\tif len(res.Message.Answer) > 0 && status != DNSSECSecure {\n',
                      '\t\t\tif len(res.Message.Answer) > 0 && terminalStatus != DNSSECSecure {\n',
                  ),
              ],
              'internal/gcdns/routing.go': [
                  (
                      '\t\t\tmerged, err := mergeAliasResult(original, priorAnswers, priorTTL, res)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, err\n\t\t\t}\n',
                      '\t\t\tmerged, mergeErr := mergeAliasResult(original, priorAnswers, priorTTL, res)\n\t\t\tif mergeErr != nil {\n\t\t\t\treturn nil, mergeErr\n\t\t\t}\n',
                  ),
              ],
              'internal/gcdns/transport.go': [
                  (
                      '\tif err := validateDNSReply(msg, udpReply); err != nil {\n\t\tt.failures.Add(1)\n\t\treturn nil, err\n\t}\n',
                      '\tif validateErr := validateDNSReply(msg, udpReply); validateErr != nil {\n\t\tt.failures.Add(1)\n\t\treturn nil, validateErr\n\t}\n',
                  ),
                  (
                      '\tif err := validateDNSReply(msg, tcpReply); err != nil {\n\t\tt.failures.Add(1)\n\t\treturn nil, err\n\t}\n',
                      '\tif validateErr := validateDNSReply(msg, tcpReply); validateErr != nil {\n\t\tt.failures.Add(1)\n\t\treturn nil, validateErr\n\t}\n',
                  ),
              ],
              'internal/gcdns/validating_forwarding.go': [
                  (
                      '\t\t\tmerged, err := mergeAliasResult(original, priorAnswers, priorTTL, res)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, err\n\t\t\t}\n',
                      '\t\t\tmerged, mergeErr := mergeAliasResult(original, priorAnswers, priorTTL, res)\n\t\t\tif mergeErr != nil {\n\t\t\t\treturn nil, mergeErr\n\t\t\t}\n',
                  ),
                  (
                      '\tif signerZone, present, err := forwardingSignerZone(proofMsg); err != nil {\n\t\treturn nil, "", false, err\n',
                      '\tif signerZone, present, signerErr := forwardingSignerZone(proofMsg); signerErr != nil {\n\t\treturn nil, "", false, signerErr\n',
                  ),
                  (
                      '\t\t\tstatus, err := r.validator.AuthenticateTerminalAnswer(aliasMsg, keys)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, "", false, fmt.Errorf("goreecloud dns: validating forwarding alias DNSSEC authentication failed: %w", err)\n\t\t\t}\n\t\t\tif status != DNSSECSecure {\n\t\t\t\treturn nil, "", false, fmt.Errorf("goreecloud dns: validating forwarding alias response for %s is %s", dns.Fqdn(q.Name), status)\n',
                      '\t\t\taliasStatus, aliasErr := r.validator.AuthenticateTerminalAnswer(aliasMsg, keys)\n\t\t\tif aliasErr != nil {\n\t\t\t\treturn nil, "", false, fmt.Errorf("goreecloud dns: validating forwarding alias DNSSEC authentication failed: %w", aliasErr)\n\t\t\t}\n\t\t\tif aliasStatus != DNSSECSecure {\n\t\t\t\treturn nil, "", false, fmt.Errorf("goreecloud dns: validating forwarding alias response for %s is %s", dns.Fqdn(q.Name), aliasStatus)\n',
                  ),
              ],
              'internal/gcdns/validating_stub_subdelegation.go': [
                  (
                      '\t\t\tstatus, err := r.validator.AuthenticateTerminalAnswer(res.Message, parentKeys)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, fmt.Errorf("goreecloud dns: validating stub terminal DNSSEC authentication failed: %w", err)\n\t\t\t}\n\t\t\tif status != DNSSECSecure {\n\t\t\t\treturn nil, fmt.Errorf("goreecloud dns: validating stub terminal response for %s is %s", qname, status)\n',
                      '\t\t\tterminalStatus, terminalErr := r.validator.AuthenticateTerminalAnswer(res.Message, parentKeys)\n\t\t\tif terminalErr != nil {\n\t\t\t\treturn nil, fmt.Errorf("goreecloud dns: validating stub terminal DNSSEC authentication failed: %w", terminalErr)\n\t\t\t}\n\t\t\tif terminalStatus != DNSSECSecure {\n\t\t\t\treturn nil, fmt.Errorf("goreecloud dns: validating stub terminal response for %s is %s", qname, terminalStatus)\n',
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected shadowing snippet not found in {filename}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          go tool gofumpt --extra -w \
            internal/gcdns/iterative_dnssec.go \
            internal/gcdns/routing.go \
            internal/gcdns/transport.go \
            internal/gcdns/validating_forwarding.go \
            internal/gcdns/validating_stub_subdelegation.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/gcdns
          git commit -m 'Fix native DNS variable shadowing'
          git push origin HEAD:agent/beacon-resolver-foundation
