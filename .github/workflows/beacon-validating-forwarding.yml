name: Beacon validating forwarding

permissions: {}

env:
  GO_VERSION: '1.26.6'

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  beacon-validating-forwarding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true
          cache-dependency-path: go.sum
      - name: Validate Beacon locally validating forwarding contract
        run: python3 scripts/validate_validating_forwarding.py
      - name: Test native GoreeCloud DNS core
        run: go test ./internal/gcdns
