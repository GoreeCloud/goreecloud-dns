<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
        <meta name="google" content="notranslate">
        <meta http-equiv="x-dns-prefetch-control" content="off">
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="theme-color" content="#287d68">
        <meta name="description" content="GoreeCloud DNS — private DNS filtering, policy enforcement, and service discovery for GoreeCloud.">
        <link rel="icon" type="image/svg+xml" href="assets/goreecloud-dns-mark.svg">
        <title>GoreeCloud DNS</title>
        <style>
            .wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }

            [data-theme="dark"] .wrapper {
                background-color: #0d1318;
            }
        </style>
    </head>
    <body>
        <noscript>
            You need to enable JavaScript to run GoreeCloud DNS.
        </noscript>
        <div id="root">
            <div class="wrapper"></div>
        </div>
        <script>
            (function() {
                var LOCAL_STORAGE_THEME_KEY = 'account_theme';
                var storedTheme = null;
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

                try {
                    storedTheme = window.localStorage.getItem(LOCAL_STORAGE_THEME_KEY);
                } catch(e) {
                    console.error(e);
                }

                document.body.dataset.theme = storedTheme || (prefersDark ? 'dark' : 'light');
            })();
        </script>
    </body>
</html>
