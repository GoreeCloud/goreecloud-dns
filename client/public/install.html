<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
        <meta name="google" content="notranslate">
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="theme-color" content="#287d68">
        <meta name="description" content="Set up GoreeCloud DNS.">
        <link rel="icon" type="image/svg+xml" href="assets/goreecloud-dns-mark.svg">
        <title>Set up GoreeCloud DNS</title>
    </head>
    <body>
        <noscript>
            You need to enable JavaScript to set up GoreeCloud DNS.
        </noscript>
        <div id="root"></div>
        <script>
            (function() {
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.body.dataset.theme = prefersDark ? 'dark' : 'light';
            })();
        </script>
    </body>
</html>
