# GoreeCloud DNS Response Policy Zone (RPZ) contract.
#
# RPZ feeds are optional and disabled by default.  Production feeds must be
# explicitly approved, documented, integrity-checked, and tested before use.

# Example local RPZ file:
# rpz:
#     name: "goreecloud-policy."
#     zonefile: "/etc/unbound/goreecloud/rpz/goreecloud-policy.zone"
#     rpz-log: yes
#     rpz-log-name: "goreecloud-policy"
#     rpz-signal-nxdomain-ra: yes
