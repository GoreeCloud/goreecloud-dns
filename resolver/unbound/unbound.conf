# GoreeCloud DNS resolver backend
#
# Role: private recursive/caching/forwarding resolver behind the client-facing
# GoreeCloud DNS (AdGuard Home) policy layer.  This file intentionally exposes
# DNS only on loopback by default; production interface changes require an
# explicit deployment override and firewall review.

server:
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""

    interface: 127.0.0.1@5353
    interface: ::1@5353
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    # Resolver hardening and privacy.
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    qname-minimisation: yes
    qname-minimisation-strict: no
    minimal-responses: yes
    unwanted-reply-threshold: 10000000
    deny-any: yes

    # DNSSEC validation.  The root trust anchor is maintained by unbound-anchor.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes
    val-permissive-mode: no
    aggressive-nsec: yes

    # Cache behavior and resilience.
    cache-min-ttl: 30
    cache-max-ttl: 86400
    cache-max-negative-ttl: 3600
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-reply-ttl: 30
    serve-expired-client-timeout: 1800
    prefetch: yes
    prefetch-key: yes

    # Concurrency and cache partitioning.  Production deployments may tune
    # thread count and slab counts after measurement; slab counts stay powers
    # of two to reduce lock contention.
    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    msg-cache-size: 64m
    rrset-cache-size: 128m
    outgoing-range: 8192
    num-queries-per-thread: 4096

    # Socket/resource behavior.
    so-reuseport: yes
    edns-buffer-size: 1232
    max-udp-size: 1232
    outgoing-num-tcp: 32
    incoming-num-tcp: 32

    # Observability.  Statistics are available through unbound-control and are
    # not written as raw per-query telemetry by this configuration.
    statistics-interval: 0
    statistics-cumulative: no
    extended-statistics: yes

    # DNS rebinding/private-address protections.  Private answers remain
    # available only for explicitly declared private-domain exceptions or
    # local-zone/local-data entries in the companion files.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    include: "/etc/unbound/goreecloud/local-zones.conf"
    include: "/etc/unbound/goreecloud/rpz.conf"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-interface: ::1
    control-use-cert: yes
    server-key-file: "/etc/unbound/unbound_server.key"
    server-cert-file: "/etc/unbound/unbound_server.pem"
    control-key-file: "/etc/unbound/unbound_control.key"
    control-cert-file: "/etc/unbound/unbound_control.pem"

# Default forwarding policy.  Replace these documentation-only examples with
# approved upstream resolver addresses through deployment-specific overrides.
# Multiple forward-addr entries provide availability and failover.
forward-zone:
    name: "."
    forward-first: no
    forward-tls-upstream: no
    # forward-addr: 9.9.9.9
    # forward-addr: 149.112.112.112

# Example split-forward zone.  Keep commented until a designated internal
# resolver exists and the zone has been explicitly approved.
# forward-zone:
#     name: "example.internal."
#     forward-first: no
#     forward-addr: 10.0.0.53
