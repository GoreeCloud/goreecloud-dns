# GoreeCloud DNS local-zone and local-data examples.
#
# Keep production private records in deployment-controlled configuration.
# This repository file defines the supported shape without embedding private
# host addresses or secrets.

# Example authoritative local zone:
# local-zone: "home.arpa." static
# local-data: "router.home.arpa. 300 IN A 192.168.1.1"

# Example private-domain exception for a namespace that is expected to return
# RFC1918/ULA answers.  Add only approved internal/private namespaces.
# private-domain: "home.arpa."

# Refuse reverse lookups for addresses that should never be forwarded outside
# the local environment when no authoritative local data exists.
local-zone: "10.in-addr.arpa." nodefault
local-zone: "16.172.in-addr.arpa." nodefault
local-zone: "17.172.in-addr.arpa." nodefault
local-zone: "18.172.in-addr.arpa." nodefault
